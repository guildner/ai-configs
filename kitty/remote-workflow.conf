# Managed by ai-configs/kitty/install.sh.

# Needed so the Cmd+Shift+V overlay helper can inspect the parent pane and
# insert the uploaded remote path with `kitten @`.
allow_remote_control yes

# Keep local selections and remote OSC 52 copies available on the macOS clipboard.
copy_on_select clipboard
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Upload a clipboard image to the host detected from the active remote pane and
# insert the resulting remote path into the prompt.
map cmd+shift+v launch --type=overlay --allow-remote-control ${HOME}/.local/bin/kitty-paste-image-to-ssh
map ctrl+alt+v launch --type=overlay --allow-remote-control ${HOME}/.local/bin/kitty-paste-image-to-ssh

# One-window entry points for remote Herdr environments. No remote hosts are
# configured in this fork yet; upstream mapped the original author's machines.
# Uncomment and replace with your own hosts/paths when you set them up.
# map cmd+shift+1 launch --type=os-window --os-window-title "host1 · Herdr" kitten ssh host1 -t /home/myuser/.local/bin/herdr-kitty
# map cmd+shift+2 launch --type=os-window --os-window-title "host2 · Herdr" kitten ssh host2 -t /home/myuser/.local/bin/herdr-kitty
# map cmd+alt+1 launch --type=os-window --os-window-title "host1 · shell" kitten ssh host1
# map cmd+alt+2 launch --type=os-window --os-window-title "host2 · shell" kitten ssh host2

# Herdr tab switching over mosh / legacy byte streams:
# bare Option+[ is ESC [ (held as incomplete CSI) and Option+] is ESC ]
# (held as incomplete OSC), so Herdr never delivers alt+bracket key events.
# Kitty keyboard send_key also fails through mosh (no kitty key protocol).
# Inject complete xterm modifyOtherKeys sequences that herdr parses as alt+[ / ].
map alt+[ send_text all \x1b[27;3;91~
map alt+] send_text all \x1b[27;3;93~
